<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="/assets/images/logo.svg" type="image/x-icon">
    <title>login Page</title>

    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/login-page.css">
    <link rel="stylesheet" href="/assets/css/global-font.css">
</head>

<body>
    <header class="login-c">
        <nav class="navbar columns">
            <div class="logo column">
                <a href="/">
                    <img src="/assets/images/logo.svg" alt="Logo">
                    <h2 class="title">Project Manager</h2>
                </a>
            </div>

            <div class="column menu">
            </div>

        </nav>
    </header>


    <section class="sec aling-center justify-center" id="login">
        <div class="content aling-left">
            <div class="columns">
                <div class="column max-column justify-center gap-min">
                    <h2 class="title">Login to Your Account</h2>
                    <p class="text">Enter your credentials to access your account</p>
                </div>
                <div class="column max-column">
                    <form action="/login" method="post">
                        <div class="group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                            <span class="alert-form"></span>
                        </div>

                        <div class="group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter your password"
                                required>
                            <span class="alert-form"></span>
                        </div>

                        <button class="button butt-norm" type="submit">Login</button>

                    </form>
                </div>
            </div>
        </div>
    </section>


    <span class="alert"></span>


    <footer class="home-f">
        <div class="columns">
            <div class="column group-social">
                <a href="http://facebook.com" class="social" target="_blank" aria-label="Facebook">
                    <img src="/assets/images/facebook-i-f.svg" alt="Logo facebook" class="icon">
                </a>
                <a href="http://instagram.com" class="social" target="_blank" aria-label="Instagram">
                    <img src="/assets/images/instagram-i-f.svg" alt="Logo instagram" class="icon">
                </a>
                <a href="https://www.linkedin.com/in/vitoriaellen03" class="social" target="_blank"
                    aria-label="LinkedIn">
                    <img src="/assets/images/linkedin-i-f.svg" alt="Logo linkedin" class="icon">
                </a>
            </div>
            <div class="column">
                <p class="text">&copy; 2024 Project Manager. All rights reserved.</p>
            </div>
            <div class="column">
                <a href="/" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
                <a href="/" target="_blank" rel="noopener noreferrer">Terms of Service</a>
            </div>
        </div>
    </footer>


    <!--Inserindo JS-->
    <script src="/assets/js/global.js"></script>
    <script src="/assets/js/login-page.js"></script>

</body>

</html>
